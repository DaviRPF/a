<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Prospects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Organizador de Prospects</h1>
        </header>

        <!-- Formulário de Adicionar Prospect -->
        <section class="add-prospect-section">
            <h2>Adicionar Novo Prospect</h2>
            <form id="prospectForm">
                <div class="form-group">
                    <label for="nome">Nome do Estabelecimento *</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone" required>
                </div>

                <div class="form-group">
                    <label for="instagram">Instagram</label>
                    <input type="text" id="instagram" name="instagram" placeholder="@usuario">
                </div>

                <div class="form-group">
                    <label for="googleMeuNegocio">Google Meu Negócio</label>
                    <input type="text" id="googleMeuNegocio" name="googleMeuNegocio">
                </div>

                <div class="form-group">
                    <label for="presencaRedeSocial">Tem Presença na Rede Social? *</label>
                    <select id="presencaRedeSocial" name="presencaRedeSocial" required>
                        <option value="">Selecione...</option>
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">Adicionar Prospect</button>
            </form>
        </section>

        <!-- Filtro por Status -->
        <section class="filter-section">
            <h2>Filtrar por Status</h2>
            <select id="statusFilter">
                <option value="all">Todos</option>
                <option value="Não contatado ainda">Não contatado ainda</option>
                <option value="Contato com atendente">Contato com atendente</option>
                <option value="Contato com decisor">Contato com decisor</option>
                <option value="Continuidade do whatsapp">Continuidade do whatsapp</option>
                <option value="Reunião marcada">Reunião marcada</option>
                <option value="Objeção da atendente">Objeção da atendente</option>
                <option value="Objeção do decisor">Objeção do decisor</option>
            </select>
        </section>

        <!-- Lista de Prospects -->
        <section class="prospects-section">
            <h2>Lista de Prospects</h2>
            <div id="prospectsList" class="prospects-list">
                <!-- Prospects serão carregados aqui -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
